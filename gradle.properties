org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# 固定 Gradle 自身运行的 JDK。系统默认 java 是 JDK 25，Gradle 8.8 跑在 Java 25 上会报
# "Unsupported class file major version 69"（Groovy 不认 Java 25 的 class 文件）导致构建直接失败。
# 本项目为 Java 17 (Forge 47.x)，必须锁在 JDK 17。换成其它机器时改这一行即可。
org.gradle.java.home=C:/Program Files/Java/jdk-17
# Minecraft Version
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Forge Version
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
# Mapping Version
mapping_channel=official
mapping_version=1.20.1
# Dragon Survival Version
dragonsurvival_version_range=[2.0.67,)
# Mod Info
mod_id=wing_kirin
mod_name=Wing Kirin
mod_license=All Rights Reserved
mod_version=1.20.1-V0.1.5-alpha
mod_group_id=by.timeslowly
mod_authors=timeslowly
mod_description=
